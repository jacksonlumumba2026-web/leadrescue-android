name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key so each new APK installs as an update and keeps your leads.
      # Without the DEBUG_KEYSTORE_BASE64 secret the build still works, but every build is signed
      # with a different key and you must uninstall the old app (losing data) before installing.
      - name: Use stable signing key (if the secret is set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > keystore/ci-debug.keystore
            echo "Signing with the stable key from the DEBUG_KEYSTORE_BASE64 secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set. The APK is signed with a temporary key; see README."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LeadRescue-1.0.${GITHUB_RUN_NUMBER}-debug.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeadRescue-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
